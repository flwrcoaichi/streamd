<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>streamd — overlay</title>
<style>
:root {
  --wm-ink: #ffffff;
  --wm-bg: rgba(8, 10, 8, 0);
  --wm-bg-solid: #0a0c0d;
  --wm-header-ink: #0a0d0a;
  --wm-mono: 'Courier New', Courier, ui-monospace, monospace;
  --wm-accent: #ffffff;
}

#stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  font-family: var(--wm-mono);
}

.wm-win {
  position: absolute;
  border: 1px solid var(--wm-ink);
  background: var(--wm-bg);
  display: flex;
  flex-direction: column;
  color: var(--wm-ink);
  box-sizing: border-box;
}

.wm-header {
  flex: none;
  height: 20px;
  line-height: 20px;
  background: var(--wm-ink);
  color: var(--wm-header-ink);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 0 8px;
  text-transform: lowercase;
  display: flex;
  align-items: center;
  justify-content: space-between;
  white-space: nowrap;
  overflow: hidden;
  cursor: default;
}

.wm-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wm-close { cursor: pointer; padding: 0 4px; flex: none; }
.wm-close:hover { opacity: 0.6; }

.wm-body {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  position: relative;
  font-size: 0.85rem;
  line-height: 1.35;
}

.wm-resize-handle {
  position: absolute;
  right: 0; bottom: 0;
  width: 14px; height: 14px;
  cursor: nwse-resize;
  background: repeating-linear-gradient(135deg, var(--wm-ink) 0px, var(--wm-ink) 1px, transparent 1px, transparent 4px);
  opacity: 0.7;
}

.wm-win.wm-selected { outline: 2px dashed var(--wm-ink); outline-offset: 2px; }
.wm-kind-popup { }
.wm-kind-topmost { z-index: 999999 !important; }
.wm-kind-topmost .wm-body { pointer-events: auto; }
.wm-kind-topmost .wm-header { pointer-events: auto; }

.wm-term { font-family: var(--wm-mono); white-space: pre-wrap; padding: 8px 10px; height: 100%; box-sizing: border-box; overflow: hidden; }
.wm-term .line { display: block; white-space: pre; overflow: hidden; text-overflow: clip; }
.wm-dim { opacity: 0.55; }
.wm-cursor { display: inline-block; width: 0.6em; background: var(--wm-ink); margin-left: 1px; animation: wmBlink 1s step-end infinite; }
@keyframes wmBlink { 50% { opacity: 0; } }

/* now_playing */
.np-bg { position: absolute; inset: 0; overflow: hidden; }
.np-art { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(0.55); }
.np-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; filter: brightness(0.5); }
.np-video.active { display: block; }
.np-grad { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 40%, rgba(0,0,0,0.75) 100%); }
.np-fg { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px; display: flex; gap: 6px; align-items: baseline; z-index: 2; }
.np-status { font-size: 0.7rem; opacity: 0.8; flex: none; }
.np-track { font-weight: 700; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.np-artist { font-size: 0.75rem; opacity: 0.75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* lyrics */
.lyrics-box { display: flex; flex-direction: column; gap: 2px; }
.lyric-line { opacity: 0.45; transition: opacity 0.15s, font-weight 0.15s; }
.lyric-line.active { opacity: 1; font-weight: 700; }
.lyric-line.next { opacity: 0.7; }
.lyric-word { transition: opacity 0.08s; }
.lyric-line.active .lyric-word.sung { text-decoration: underline; }

/* chat */
.wm-chat-body { padding: 6px 8px; overflow-y: auto; font-family: var(--wm-mono); font-size: 0.8rem; line-height: 1.4; }
.chat-line { margin-bottom: 2px; }
.chat-user { font-weight: 700; }
.chat-badge { height: 1em; vertical-align: middle; margin-right: 3px; }
.wm-emote { height: 1.5em; vertical-align: middle; display: inline-block; }
.wm-chat-body::-webkit-scrollbar { width: 6px; }
.wm-chat-body::-webkit-scrollbar-thumb { background: var(--wm-ink); opacity: 0.3; }

.key-panel-body { background: rgba(10, 12, 13, 0.2); }
.key-panel-row { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; width: 100%; height: 100%; }
.key-panel-key {
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700; letter-spacing: 0.08em;
  border: 2px solid rgba(255,255,255,0.18); background: var(--key-bg, rgba(15,19,22,0.9)); color: var(--key-text, #f5f7fa);
  box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset; transition: transform 0.08s ease, opacity 0.12s ease, box-shadow 0.2s ease;
  user-select: none; font-size: 0.72rem; flex: none;
}
.key-panel-key.active { transform: translateY(1px) scale(0.97); box-shadow: 0 0 12px color-mix(in srgb, var(--key-color, #7ef7c6) 60%, transparent), inset 0 0 0 1px rgba(0,0,0,0.2); }
.key-panel-round { border-radius: 999px; }
.key-panel-square { border-radius: 6px; }
.key-panel-pill { border-radius: 999px; }
.key-panel-diamond { border-radius: 8px; transform: rotate(45deg); }
.key-panel-diamond span { transform: rotate(-45deg); display: inline-block; }

/* spacer */
.spacer-body { padding: 0; }
.spacer-body canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.spacer-pre { padding: 8px 10px; }

/* alerts popup */
.alerts-body { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 4px; }

/* pngtuber */
.pngtuber-frame { max-width: 100%; max-height: 100%; transition: opacity 0.12s ease; }
.pngtuber-frame.speaking { animation: wmBob 0.42s ease-in-out infinite; }
@keyframes wmBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
body { width: 1440px; height: 1080px; }
.wm-header { cursor: default; }
.wm-close { display: none; }
.wm-resize-handle { display: none; }
</style>
</head>
<body>
<div id="stage"></div>

<script>
/* wm.js — shared window-manager core. See control.html for full doc comment.
   NOTE: setLayout now diffs against the current window set rather than
   destroying/recreating everything, so a layout broadcast from
   control.html (e.g. mid-drag) no longer wipes chat/message/tts state
   here — only windows that were actually added/removed/changed panel
   type get torn down and rebuilt. */
</script>
<script src="/wm.js"></script>
<script src="/panels.js"></script>
<script>
(function () {
  const DEFAULT_LAYOUT = [
    { id: 'now_playing', panel: 'now_playing', title: 'now playing', x: 1040, y: 20,  w: 380, h: 160, z: 1, kind: 'normal' },
    { id: 'lyrics',      panel: 'lyrics',      title: 'lyrics',      x: 1040, y: 190, w: 380, h: 160, z: 1, kind: 'normal' },
    { id: 'status',      panel: 'status',      title: 'pc status',   x: 20,   y: 900, w: 220, h: 130, z: 1, kind: 'normal' },
    { id: 'socials',     panel: 'socials',     title: 'socials',     x: 20,   y: 780, w: 220, h: 70,  z: 1, kind: 'normal', opts: { social_lines: 'twitter: @vanillyn_net\ndiscord: @vanillyn' } },
    { id: 'message_bar', panel: 'message_bar', title: 'message',    x: 20,   y: 740, w: 220, h: 36,  z: 1, kind: 'normal', opts: { text_color: '#d8dee2', bg_color: '#0a0c0d', font_size: 13, font_family: 'monospace' } },
    { id: 'screen',      panel: 'screen',      title: 'screen',      x: 260,  y: 780, w: 400, h: 260, z: 0, kind: 'normal' },
    { id: 'key_panel',   panel: 'key_panel',  title: 'keys',        x: 260,  y: 620, w: 280, h: 120, z: 1, kind: 'normal', opts: { shape: 'round', size: 48, gap: 8, glow: true, active_color: '#7ef7c6', inactive_color: '#1f2731', text_color: '#f5f7fa', keys: [{ key: 'w', label: 'W', shape: 'round', color: '#7ef7c6' }, { key: 'a', label: 'A', shape: 'square', color: '#7ef7c6' }, { key: 's', label: 'S', shape: 'square', color: '#7ef7c6' }, { key: 'd', label: 'D', shape: 'square', color: '#7ef7c6' }, { key: 'space', label: 'SPACE', shape: 'pill', color: '#8be9fd' }] } },
    { id: 'chat',        panel: 'chat',        title: 'chat',        x: 20,   y: 20,  w: 380, h: 480, z: 1, kind: 'normal', opts: { text_color: '#d8dee2', bg_color: '', font_size: 13, font_family: 'monospace' } },
    { id: 'extra',       panel: 'extra',       title: 'extra',       x: 1040, y: 900, w: 380, h: 130, z: 1, kind: 'normal', opts: { text_color: '#d8dee2', bg_color: '', font_size: 13, font_family: 'monospace' } },
    { id: 'spacer_1',    panel: 'spacer',      title: 'log',         x: 20,   y: 520, w: 220, h: 240, z: 1, kind: 'normal', opts: { spacer_kind: 'bootlog' } },
    { id: 'alerts',      panel: 'alerts',      title: 'alert',       x: 530,  y: 40,  w: 420, h: 140, z: 500, kind: 'popup', visible: false },
    { id: 'redeem_player', panel: 'redeem_player', title: 'redeem',  x: 460,  y: 300, w: 520, h: 440, z: 500, kind: 'popup', visible: false },
    { id: 'pngtuber',    panel: 'pngtuber',    title: 'pngtuber',    x: 900,  y: 500, w: 400, h: 580, z: 999999, kind: 'topmost' },
    { id: 'words',       panel: 'words',       title: 'words',       x: 300,  y: 200, w: 600, h: 500, z: 800, kind: 'normal', opts: { wos_url: 'https://wos.gg/' } },
    { id: 'tts_transcript', panel: 'tts_transcript', title: 'tts', x: 20, y: 660, w: 220, h: 70, z: 1, kind: 'normal', opts: { text_color: '#d8dee2', bg_color: '', font_size: 13, font_family: 'monospace' } },
    { id: 'ad_warning',  panel: 'ad_warning',  title: 'ad break',    x: 530,  y: 40,  w: 420, h: 100, z: 700, kind: 'popup', visible: false, opts: { text_color: '#ffb238', bg_color: '#1a1409', font_size: 16 } },
    { id: 'canvas',      panel: 'canvas',      title: 'canvas',      x: 520,  y: 260, w: 400, h: 400, z: 600, kind: 'popup', visible: false, opts: { size: 100, bg_color: '#0a0c0d' } },
  ];

  const WS_URL = `ws://${location.hostname}:8877`;
  let ws = null;
  const overlayState = { channel: (new URLSearchParams(location.search)).get('channel') || '' };
  const handles = new Map(); // winId -> panel handle

  const wm = createWM({
    stageEl: document.getElementById('stage'),
    editable: false,
    getRenderer: (panelName) => Panels[panelName],
    renderBody: (win, bodyEl) => {
      const renderer = Panels[win.panel];
      if (!renderer) { bodyEl.textContent = 'unknown panel: ' + win.panel; return null; }
      const h = renderer.mount(bodyEl, win, overlayState);
      handles.set(win.id, h);
      return h;
    },
    onWindowOptsChanged: (win, rec) => {
      // font-size/color live-updates on windows that support opts, without
      // a full remount. Panels that support this expose applyOpts(handle, win).
      const renderer = Panels[win.panel];
      const h = handles.get(win.id);
      if (renderer && renderer.applyOpts && h) renderer.applyOpts(h, win);
    },
  });

  function broadcastToAllPanels(key, msg) {
    wm.forEachWindow((win) => {
      const renderer = Panels[win.panel];
      const h = handles.get(win.id);
      if (renderer && h && renderer.onState) {
        renderer.onState(h, key, msg, overlayState, wm, win.id);
      }
    });
  }

  function applyLayoutFromServer(layout) {
    if (Array.isArray(layout) && layout.length) {
      wm.setLayout(layout, { silent: true });
    } else {
      wm.setLayout(DEFAULT_LAYOUT, { silent: true });
    }
  }

  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => {};
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      handleMessage(msg);
    };
  }

  function handleMessage(msg) {
    const t = msg.type;
    if (t === 'init') {
      const s = msg.state || {};
      applyLayoutFromServer(s.wm_layout);
      if (s.music) broadcastToAllPanels('music', s.music);
      if (s.stats) broadcastToAllPanels('stats', s.stats);
      if (s.status) broadcastToAllPanels('status', { value: s.status });
      if (s.scene) broadcastToAllPanels('scene', { value: s.scene });
      if (s.extra !== undefined) broadcastToAllPanels('extra', { value: s.extra });
      if (s.pngtuber) broadcastToAllPanels('pngtuber', s.pngtuber);
      if (s.words) broadcastToAllPanels('words', s.words);
      if (s.ads) broadcastToAllPanels('ads_state', s.ads);
      if (s.key_panel) broadcastToAllPanels('key_panel', s.key_panel);
      if (s.canvas) broadcastToAllPanels('canvas_state', s.canvas);
      (s.chat || []).forEach(c => broadcastToAllPanels('chat', c));
      fetch('/pngtuber-list').then(r => r.json()).then(a => broadcastToAllPanels('assets', a)).catch(() => {});
      if (s.tts) broadcastToAllPanels('tts_state', s.tts);
      return;
    }
    if (t === 'wm_layout') { applyLayoutFromServer(msg.layout); return; }
    if (t === 'music') { broadcastToAllPanels('music', msg); return; }
    if (t === 'music_video') { broadcastToAllPanels('music_video', msg); return; }
    if (t === 'stats') { broadcastToAllPanels('stats', msg); return; }
    if (t === 'status') { broadcastToAllPanels('status', { value: msg.value }); return; }
    if (t === 'scene') { broadcastToAllPanels('scene', { value: msg.value }); return; }
    if (t === 'message') { broadcastToAllPanels('message', { value: msg.value }); return; }
    if (t === 'extra') { broadcastToAllPanels('extra', { value: msg.value }); return; }
    if (t === 'chat') { broadcastToAllPanels('chat', msg); return; }
    if (t === 'lyrics') { broadcastToAllPanels('lyrics', msg); return; }
    if (t === 'pngtuber') { broadcastToAllPanels('pngtuber', msg.pngtuber); return; }
    if (t === 'tts_state') { broadcastToAllPanels('tts_state', msg.tts); return; }
    if (t === 'play_media') { broadcastToAllPanels('play_media', msg); return; }
    if (t === 'alert') { broadcastToAllPanels('alert_event', msg); return; }
    if (t === 'follow') { broadcastToAllPanels('alert_event', { alert: 'follow', message: msg.user + ' followed!' }); return; }
    if (t === 'raid') { broadcastToAllPanels('alert_event', { alert: 'raid', message: msg.user + ' raided!', sub: (msg.viewers || 0) + ' raiders' }); return; }
    if (t === 'redeem_alert') { broadcastToAllPanels('alert_event', { alert: 'redeem', message: msg.user + ' → ' + msg.reward, sub: msg.message || '' }); return; }
    if (t === 'words_state') { broadcastToAllPanels('words', msg.words); return; }
    if (t === 'key_panel') { broadcastToAllPanels('key_panel', msg.key_panel); return; }
    if (t === 'ads_state') { broadcastToAllPanels('ads_state', msg.ads); return; }
    if (t === 'canvas_state') { broadcastToAllPanels('canvas_state', msg.canvas); return; }
    if (t === 'canvas_pixel') { broadcastToAllPanels('canvas_pixel', msg); return; }
  }

  // pngtuber needs a periodic tick even without new messages, to catch the
  // chattingUntil timeout expiring
  setInterval(() => broadcastToAllPanels('tick', {}), 300);

  connect();
})();
</script>
</body>
</html>
