<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=1440" />
<title>streamd — overlay</title>
<style>
/* wm.css — window-manager chrome, shared by overlay.html and control.html.
   Monospace-only, flat borders, no webfonts/frameworks. */

:root {
  --wm-ink: #ffffff;
  --wm-bg: rgba(8, 10, 8, 0);
  --wm-bg-solid: #0a0c0d;
  --wm-header-ink: #0a0d0a;
  --wm-mono: 'Courier New', Courier, ui-monospace, monospace;
  --wm-accent: #ffffff;
}

#stage {
  position: fixed;
  inset: 0;
  overflow: hidden;
  font-family: var(--wm-mono);
}

.wm-win {
  position: absolute;
  border: 1px solid var(--wm-ink);
  background: var(--wm-bg);
  display: flex;
  flex-direction: column;
  color: var(--wm-ink);
  box-sizing: border-box;
}

.wm-header {
  flex: none;
  height: 20px;
  line-height: 20px;
  background: var(--wm-ink);
  color: var(--wm-header-ink);
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 0 8px;
  text-transform: lowercase;
  display: flex;
  align-items: center;
  justify-content: space-between;
  white-space: nowrap;
  overflow: hidden;
  cursor: default;
}

.wm-title {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.wm-close {
  cursor: pointer;
  padding: 0 4px;
  flex: none;
}
.wm-close:hover { opacity: 0.6; }

.wm-body {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  position: relative;
  font-size: 0.85rem;
  line-height: 1.35;
}

.wm-resize-handle {
  position: absolute;
  right: 0; bottom: 0;
  width: 14px; height: 14px;
  cursor: nwse-resize;
  background: repeating-linear-gradient(
    135deg,
    var(--wm-ink) 0px, var(--wm-ink) 1px,
    transparent 1px, transparent 4px
  );
  opacity: 0.7;
}

/* editable (control.html) affordances */
.wm-win.wm-selected {
  outline: 2px dashed var(--wm-ink);
  outline-offset: 2px;
}

/* popup windows: same chrome, just toggled via display:none by wm.js */
.wm-kind-popup { }

/* topmost (pngtuber): keep layout-edit interactions working by not
   letting its body become a click-through element. This lets the
   pngtuber window be selected reliably instead of falling through to
   the text beneath it. */
.wm-kind-topmost {
  z-index: 999999 !important;
}
.wm-kind-topmost .wm-body { pointer-events: auto; }
.wm-kind-topmost .wm-header { pointer-events: auto; }

/* generic text/terminal content helpers, used by panel renderers */
.wm-term {
  font-family: var(--wm-mono);
  white-space: pre-wrap;
  padding: 8px 10px;
  height: 100%;
  box-sizing: border-box;
  overflow: hidden;
}
.wm-term .line { display: block; white-space: pre; overflow: hidden; text-overflow: clip; }
.wm-dim { opacity: 0.55; }
.wm-cursor {
  display: inline-block;
  width: 0.6em;
  background: var(--wm-ink);
  margin-left: 1px;
  animation: wmBlink 1s step-end infinite;
}
@keyframes wmBlink { 50% { opacity: 0; } }

</style>
<style>
/* panels.css — content styling for each window/panel type. Monospace only. */

/* now_playing */
.np-bg { position: absolute; inset: 0; overflow: hidden; }
.np-art { position: absolute; inset: 0; background-size: cover; background-position: center; filter: brightness(0.55); }
.np-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; filter: brightness(0.5); }
.np-video.active { display: block; }
.np-grad { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 40%, rgba(0,0,0,0.75) 100%); }
.np-fg { position: absolute; left: 0; right: 0; bottom: 0; padding: 6px 10px; display: flex; gap: 6px; align-items: baseline; z-index: 2; }
.np-status { font-size: 0.7rem; opacity: 0.8; flex: none; }
.np-track { font-weight: 700; font-size: 0.85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.np-artist { font-size: 0.75rem; opacity: 0.75; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* lyrics */
.lyrics-box { display: flex; flex-direction: column; gap: 2px; }
.lyric-line { opacity: 0.45; transition: opacity 0.15s, font-weight 0.15s; }
.lyric-line.active { opacity: 1; font-weight: 700; }
.lyric-line.next { opacity: 0.7; }
.lyric-word { transition: opacity 0.08s; }
.lyric-line.active .lyric-word.sung { text-decoration: underline; }

/* chat */
.wm-chat-body {
  padding: 6px 8px;
  overflow-y: auto;
  font-family: var(--wm-mono);
  font-size: 0.8rem;
  line-height: 1.4;
}
.chat-line { margin-bottom: 2px; }
.chat-user { font-weight: 700; }
.chat-badge { height: 1em; vertical-align: middle; margin-right: 3px; }
.wm-emote { height: 1.5em; vertical-align: middle; display: inline-block; }
.wm-chat-body::-webkit-scrollbar { width: 6px; }
.wm-chat-body::-webkit-scrollbar-thumb { background: var(--wm-ink); opacity: 0.3; }

/* spacer */
.spacer-body { padding: 0; }
.spacer-body canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
.spacer-pre { padding: 8px 10px; }

/* alerts popup */
.alerts-body { display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 4px; }

/* pngtuber */
.pngtuber-frame {
  max-width: 100%;
  max-height: 100%;
  transition: opacity 0.12s ease;
}
.pngtuber-frame.speaking { animation: wmBob 0.42s ease-in-out infinite; }
@keyframes wmBob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

</style>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { width: 1440px; height: 1080px; }
  /* overlay.html renders windows without editable chrome affordances —
     header stays for the tty aesthetic, but no drag/resize/close here. */
  .wm-header { cursor: default; }
  .wm-close { display: none; }
  .wm-resize-handle { display: none; }
</style>
</head>
<body>
<div id="stage"></div>

<script>
/*
 * wm.js — shared window-manager core for streamd's overlay + control panel.
 *
 * A "window" is a plain object:
 *   {
 *     id:        string, stable identifier (e.g. "now_playing", "lyrics-2")
 *     panel:     string, which renderer owns this window's body ("now_playing","lyrics","status",
 *                "socials","screen","chat","extra","pngtuber","spacer","redeem_player","alerts")
 *     title:     string, header bar text
 *     x, y:      number, px, top-left position within the stage
 *     w, h:      number, px, size
 *     z:         number, stacking order (higher = front)
 *     kind:      "normal" | "popup" | "topmost"
 *                normal  — always rendered, draggable/resizable like anything else
 *                popup   — only rendered while .visible is true (redeem player / alerts)
 *                topmost — always rendered above everything else, z is ignored for stacking
 *     visible:   bool, only meaningful for popup windows
 *     opts:      object, panel-specific settings (e.g. spacer animation choice)
 *   }
 *
 * This file is intentionally framework-free — no build step, drops into both
 * overlay.html (render-only, chrome can be hidden) and control.html (editable,
 * chrome always shown, drag+resize enabled).
 *
 * Usage:
 *   const wm = createWM({
 *     stageEl: document.getElementById('stage'),
 *     editable: true|false,          // control.html = true, overlay.html = false
 *     onLayoutChange: (layout) => {...}, // fired on drag/resize end + add/remove
 *     renderBody: (win, bodyEl) => {...} // caller fills in panel content
 *   });
 *   wm.setLayout(layoutArray);       // replace all windows
 *   wm.getLayout();                  // current layout array (plain JSON-able)
 *   wm.addWindow({...});
 *   wm.removeWindow(id);
 *   wm.updateWindow(id, patch);
 */

function createWM(opts) {
  const stageEl = opts.stageEl;
  const editable = !!opts.editable;
  const onLayoutChange = opts.onLayoutChange || (() => {});
  const renderBody = opts.renderBody || (() => {});
  const onSelect = opts.onSelect || (() => {});

  const GRID = opts.gridSize || 1; // px snap; 1 = off
  const MIN_W = 80, MIN_H = 60;

  let windows = new Map(); // id -> window state
  let els = new Map();     // id -> {root, body, header}
  let zCounter = 10;
  let selectedId = null;
  let suppressEmit = false;

  function snap(v) {
    if (GRID <= 1) return Math.round(v);
    return Math.round(v / GRID) * GRID;
  }

  function clampToStage(win) {
    const sw = stageEl.clientWidth || 1440;
    const sh = stageEl.clientHeight || 1080;
    win.w = Math.max(MIN_W, Math.min(win.w, sw));
    win.h = Math.max(MIN_H, Math.min(win.h, sh));
    win.x = Math.max(0, Math.min(win.x, sw - 10));
    win.y = Math.max(0, Math.min(win.y, sh - 10));
  }

  function emitLayoutChange() {
    if (suppressEmit) return;
    onLayoutChange(getLayout());
  }

  function getLayout() {
    return Array.from(windows.values()).map(w => ({ ...w }));
  }

  function setLayout(layoutArr, opts2) {
    opts2 = opts2 || {};
    suppressEmit = !!opts2.silent;
    // remove windows not present in new layout
    const nextIds = new Set((layoutArr || []).map(w => w.id));
    for (const id of Array.from(windows.keys())) {
      if (!nextIds.has(id)) destroyWindowEl(id);
    }
    windows = new Map();
    (layoutArr || []).forEach(w => {
      const win = normalizeWindow(w);
      windows.set(win.id, win);
      zCounter = Math.max(zCounter, (win.z || 0) + 1);
    });
    renderAll();
    suppressEmit = false;
  }

  function normalizeWindow(w) {
    return {
      id: w.id,
      panel: w.panel,
      title: w.title || w.panel || w.id,
      x: typeof w.x === 'number' ? w.x : 40,
      y: typeof w.y === 'number' ? w.y : 40,
      w: typeof w.w === 'number' ? w.w : 320,
      h: typeof w.h === 'number' ? w.h : 200,
      z: typeof w.z === 'number' ? w.z : 1,
      kind: w.kind || 'normal',
      visible: w.visible !== undefined ? !!w.visible : (w.kind !== 'popup'),
      opts: w.opts || {},
    };
  }

  function addWindow(w) {
    const win = normalizeWindow(w);
    win.z = zCounter++;
    windows.set(win.id, win);
    renderWindow(win);
    emitLayoutChange();
    return win;
  }

  function removeWindow(id) {
    windows.delete(id);
    destroyWindowEl(id);
    emitLayoutChange();
  }

  function updateWindow(id, patch, opts2) {
    const win = windows.get(id);
    if (!win) return;
    Object.assign(win, patch);
    clampToStage(win);
    const rec = els.get(id);
    if (rec) applyGeometry(win, rec);
    if (!(opts2 && opts2.silent)) emitLayoutChange();
  }

  function bringToFront(id) {
    const win = windows.get(id);
    if (!win) return;
    win.z = zCounter++;
    const rec = els.get(id);
    if (rec && win.kind !== 'topmost') rec.root.style.zIndex = String(win.z);
  }

  function select(id) {
    selectedId = id;
    els.forEach((rec, wid) => {
      rec.root.classList.toggle('wm-selected', wid === id);
    });
    onSelect(id);
  }

  function destroyWindowEl(id) {
    const rec = els.get(id);
    if (rec && rec.root.parentNode) rec.root.parentNode.removeChild(rec.root);
    els.delete(id);
  }

  function renderAll() {
    els.forEach((rec) => { if (rec.root.parentNode) rec.root.parentNode.removeChild(rec.root); });
    els = new Map();
    windows.forEach(win => renderWindow(win));
  }

  function applyGeometry(win, rec) {
    rec.root.style.left = win.x + 'px';
    rec.root.style.top = win.y + 'px';
    rec.root.style.width = win.w + 'px';
    rec.root.style.height = win.h + 'px';
    if (win.kind !== 'topmost') rec.root.style.zIndex = String(win.z);
    const shouldHidePopupInOverlay = win.kind === 'popup' && !win.visible && !editable;
    rec.root.style.display = shouldHidePopupInOverlay ? 'none' : '';
  }

  function renderWindow(win) {
    const root = document.createElement('div');
    root.className = 'wm-win wm-kind-' + win.kind;
    root.dataset.id = win.id;

    const header = document.createElement('div');
    header.className = 'wm-header';

    const title = document.createElement('span');
    title.className = 'wm-title';
    title.textContent = win.title;
    header.appendChild(title);

    if (editable) {
      const closeBtn = document.createElement('span');
      closeBtn.className = 'wm-close';
      closeBtn.textContent = '×';
      closeBtn.title = 'remove window';
      closeBtn.onclick = (e) => { e.stopPropagation(); removeWindow(win.id); };
      header.appendChild(closeBtn);
    }

    const body = document.createElement('div');
    body.className = 'wm-body';

    root.appendChild(header);
    root.appendChild(body);
    stageEl.appendChild(root);

    const rec = { root, header, body };
    els.set(win.id, rec);
    applyGeometry(win, rec);

    if (editable) {
      wireDrag(win, rec, header);
      wireResize(win, rec);
      root.addEventListener('mousedown', () => { bringToFront(win.id); select(win.id); });
    }

    renderBody(win, body, rec);
    if (win.kind === 'topmost') root.classList.add('wm-topmost');
  }

  function wireDrag(win, rec, handle) {
    let dragging = false, startX = 0, startY = 0, origX = 0, origY = 0;
    handle.addEventListener('mousedown', (e) => {
      if (e.target.classList.contains('wm-close')) return;
      dragging = true;
      startX = e.clientX; startY = e.clientY;
      origX = win.x; origY = win.y;
      e.preventDefault();
      bringToFront(win.id);
    });
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      win.x = snap(origX + (e.clientX - startX));
      win.y = snap(origY + (e.clientY - startY));
      clampToStage(win);
      applyGeometry(win, rec);
    });
    window.addEventListener('mouseup', () => {
      if (!dragging) return;
      dragging = false;
      emitLayoutChange();
    });
  }

  function wireResize(win, rec) {
    const handle = document.createElement('div');
    handle.className = 'wm-resize-handle';
    rec.root.appendChild(handle);
    let resizing = false, startX = 0, startY = 0, origW = 0, origH = 0;
    handle.addEventListener('mousedown', (e) => {
      resizing = true;
      startX = e.clientX; startY = e.clientY;
      origW = win.w; origH = win.h;
      e.preventDefault();
      e.stopPropagation();
      bringToFront(win.id);
    });
    window.addEventListener('mousemove', (e) => {
      if (!resizing) return;
      win.w = snap(Math.max(MIN_W, origW + (e.clientX - startX)));
      win.h = snap(Math.max(MIN_H, origH + (e.clientY - startY)));
      clampToStage(win);
      applyGeometry(win, rec);
    });
    window.addEventListener('mouseup', () => {
      if (!resizing) return;
      resizing = false;
      emitLayoutChange();
    });
  }

  function showPopup(id, visible) {
    const win = windows.get(id);
    if (!win) return;
    win.visible = !!visible;
    if (visible) win.z = zCounter++;
    const rec = els.get(id);
    if (rec) applyGeometry(win, rec);
  }

  function getWindow(id) { return windows.get(id); }
  function forEachWindow(fn) { windows.forEach(fn); }
  function getBodyEl(id) { const rec = els.get(id); return rec ? rec.body : null; }
  function getRootEl(id) { const rec = els.get(id); return rec ? rec.root : null; }

  return {
    setLayout, getLayout, addWindow, removeWindow, updateWindow,
    showPopup, getWindow, forEachWindow, getBodyEl, getRootEl,
    bringToFront, select,
  };
}

</script>
<script>
/*
 * panels.js — per-window-type content renderers for the streamd overlay.
 *
 * Each panel exposes:
 *   mount(bodyEl, win)   — called once when the window is created; build DOM, return a handle
 *   onState(handle, key, payload) — called on every relevant websocket message
 *   unmount(handle)      — called when the window is removed (cleanup timers/RAF)
 *
 * Panels are pure UI: they read from the shared `Overlay.state` object (kept
 * up to date by overlay.html's websocket handler) and from messages passed
 * directly to onState. No panel talks to the websocket itself.
 */

const Panels = (() => {

  const $create = (tag, cls) => { const e = document.createElement(tag); if (cls) e.className = cls; return e; };
  function escapeHtml(str) {
    const d = document.createElement('div');
    d.textContent = str == null ? '' : String(str);
    return d.innerHTML;
  }

  // ── 7TV emotes (shared across chat panel instances) ─────────────────────
  const sevenTv = new Map();
  let sevenTvLoaded = false;
  async function ensure7tv(channelLogin) {
    if (sevenTvLoaded) return;
    sevenTvLoaded = true;
    try {
      const res = await fetch('https://7tv.io/v3/emote-sets/global');
      if (res.ok) {
        const data = await res.json();
        for (const e of (data.emotes || [])) {
          const host = e.data && e.data.host;
          if (!host) continue;
          const file = (host.files || []).find(f => f.format === 'WEBP' && f.name === '1x.webp') || (host.files || [])[0];
          if (file) sevenTv.set(e.name, `https:${host.url}/${file.name}`);
        }
      }
    } catch (e) { /* non-fatal */ }
    if (!channelLogin) return;
    try {
      const idRes = await fetch(`https://decapi.me/twitch/id/${encodeURIComponent(channelLogin)}`);
      if (!idRes.ok) return;
      const text = (await idRes.text()).trim();
      if (!/^\d+$/.test(text)) return;
      const userRes = await fetch(`https://7tv.io/v3/users/twitch/${text}`);
      if (!userRes.ok) return;
      const userData = await userRes.json();
      const emotes = (userData.emote_set && userData.emote_set.emotes) || [];
      for (const e of emotes) {
        const host = e.data && e.data.host;
        if (!host) continue;
        const file = (host.files || []).find(f => f.format === 'WEBP' && f.name === '1x.webp') || (host.files || [])[0];
        if (file) sevenTv.set(e.name, `https:${host.url}/${file.name}`);
      }
    } catch (e) { /* non-fatal */ }
  }

  function renderChatText(text, emotes) {
    let segments = [];
    const sorted = emotes ? [...emotes].sort((a, b) => a.start - b.start) : [];
    let cursor = 0;
    for (const e of sorted) {
      if (e.start < cursor) continue;
      if (e.start > cursor) segments.push({ text: text.slice(cursor, e.start), isEmote: false });
      segments.push({ text: e.name, isEmote: true, url: e.url, name: e.name });
      cursor = e.end + 1;
    }
    if (cursor < text.length) segments.push({ text: text.slice(cursor), isEmote: false });
    let out = '';
    for (const seg of segments) {
      if (seg.isEmote) {
        out += `<img class="wm-emote" src="${seg.url}" alt="${escapeHtml(seg.name)}" title="${escapeHtml(seg.name)}" />`;
        continue;
      }
      const words = seg.text.split(/(\s+)/);
      for (const word of words) {
        const url = sevenTv.get(word);
        if (url) out += `<img class="wm-emote" src="${url}" alt="${escapeHtml(word)}" title="${escapeHtml(word)} [7tv]" />`;
        else out += escapeHtml(word);
      }
    }
    return out;
  }

  // ── now_playing ───────────────────────────────────────────────────────
  const now_playing = {
    mount(body, win) {
      body.innerHTML = `
        <div class="np-bg"><div class="np-art"></div><video class="np-video" autoplay loop muted playsinline></video><div class="np-grad"></div></div>
        <div class="np-fg">
          <span class="np-status">▶</span>
          <span class="np-track">—</span>
          <span class="np-artist"></span>
        </div>`;
      return {
        art: body.querySelector('.np-art'),
        video: body.querySelector('.np-video'),
        track: body.querySelector('.np-track'),
        artist: body.querySelector('.np-artist'),
        status: body.querySelector('.np-status'),
        lastKey: '',
      };
    },
    onState(h, key, msg, overlayState) {
      if (key === 'music') {
        const m = msg;
        h.track.textContent = m.title || '—';
        h.artist.textContent = m.artist ? `— ${m.artist}` : '';
        h.status.textContent = m.playing ? '▶' : '⏸';
        const k = `${m.title}::${m.artist}`;
        if (k !== h.lastKey) {
          h.lastKey = k;
          if (m.title && m.title !== '—') {
            h.art.style.backgroundImage = `url('/art.png?t=${Date.now()}')`;
          } else {
            h.art.style.backgroundImage = '';
          }
        }
      } else if (key === 'music_video') {
        if (msg.url) {
          h.video.src = msg.url;
          h.video.classList.add('active');
        } else {
          h.video.classList.remove('active');
          h.video.removeAttribute('src');
        }
      }
    },
  };

  // ── lyrics ───────────────────────────────────────────────────────────
  const lyrics = {
    mount(body, win) {
      body.classList.add('wm-term');
      const box = $create('div', 'lyrics-box');
      body.appendChild(box);
      return { box, data: { synced_lines: [], synced_words: [], plain_lines: [] }, raf: null, musicState: { playing: false, duration: 0, position: 0, _updatedAt: 0 } };
    },
    onState(h, key, msg) {
      if (key === 'music') {
        h.musicState = { playing: msg.playing, duration: Number(msg.duration) || 0, position: Number(msg.position) || 0, _updatedAt: performance.now() };
      } else if (key === 'lyrics') {
        if (!msg.found) {
          h.data = { synced_lines: [], synced_words: [], plain_lines: [] };
          h.box.innerHTML = '<span class="wm-dim">no lyrics</span>';
          return;
        }
        h.data = {
          synced_lines: msg.synced_lines || [],
          synced_words: msg.synced_words || [],
          plain_lines: msg.plain_lines || msg.lines || [],
        };
        startLoop(h);
      }
    },
    unmount(h) { if (h.raf) cancelAnimationFrame(h.raf); },
  };
  function elapsedSeconds(h) {
    if (!h.musicState.playing) return h.musicState.position;
    return h.musicState.position + (performance.now() - h.musicState._updatedAt) / 1000;
  }
  function activeLineIndex(h, elapsed) {
    const lines = h.data.synced_lines;
    let idx = -1;
    for (let i = 0; i < lines.length; i++) { if (lines[i].time <= elapsed) idx = i; else break; }
    return idx;
  }
  function renderLyricsDOM(h) {
    const elapsed = elapsedSeconds(h);
    const lines = h.data.synced_lines, words = h.data.synced_words, plain = h.data.plain_lines;
    let displayLines = [], activeIdx = -1;
    const ABOVE = 2, BELOW = 3;
    if (lines.length) {
      activeIdx = activeLineIndex(h, elapsed);
      const start = Math.max(0, activeIdx - ABOVE);
      const end = Math.min(lines.length - 1, (activeIdx < 0 ? BELOW - 1 : activeIdx) + BELOW);
      for (let i = start; i <= end; i++) displayLines.push({ idx: i, text: lines[i].text, time: lines[i].time });
    } else if (plain.length) {
      const dur = h.musicState.duration || 180;
      const prog = Math.min(1, Math.max(0, elapsed / dur));
      const mid = Math.floor(prog * plain.length);
      const start = Math.max(0, mid - ABOVE), end = Math.min(plain.length - 1, mid + BELOW);
      for (let i = start; i <= end; i++) displayLines.push({ idx: i, text: plain[i], time: null });
      activeIdx = mid;

    if (!displayLines.length) { h.box.innerHTML = '<span class="wm-dim">—</span>'; return; }
    h.box.innerHTML = '';
    for (const dl of displayLines) {
      const lineEl = $create('div', 'lyric-line' + (dl.idx === activeIdx ? ' active' : (dl.idx === activeIdx + 1 ? ' next' : '')));
      if (dl.idx === activeIdx && words.length && dl.text) {

      h.box.appendChild(lineEl);
    }

function escapeHtml(str) {
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

const spacer = {
  mount(body, win) {
    body.classList.add('wm-term', 'spacer-body');
    const kind = (win && win.opts && win.opts.spacer_kind) || 'bootlog';
    const canvas = document.createElement('canvas');
    const pre = document.createElement('div');
    pre.className = 'spacer-pre';
    body.appendChild(canvas);
    body.appendChild(pre);

    const h = {
      kind,
      canvas,
      pre,
      raf: null,
      timer: null,
      lineIdx: 0,
      cleanups: [],
      body
    };

    startSpacer(h);
    return h;
  },

  onState(h, state) {
    if (state && state.spacer_kind && state.spacer_kind !== h.kind) {
      h.kind = state.spacer_kind;
      this.unmount(h);
      startSpacer(h);
    }
  },

  unmount(h) {
    if (h.raf) cancelAnimationFrame(h.raf);
    if (h.timer) clearTimeout(h.timer);
    h.raf = null;
    h.timer = null;
    if (h.cleanups) {
      h.cleanups.forEach(fn => fn());
      h.cleanups = [];
    }
  }
};

function startSpacer(h) {
  h.cleanups = [];

  // Bootlog Mode (Text-based)
  if (h.kind === 'bootlog') {
    h.pre.style.display = 'block';
    h.canvas.style.display = 'none';
    const tick = () => {
      const n = Math.min(BOOTLOG_LINES.length, h.lineIdx + 1);
      h.pre.innerHTML =
        BOOTLOG_LINES.slice(0, n)
          .map(l => `<div class="line">${escapeHtml(l)}</div>`)
          .join('') + '<span class="wm-cursor">&nbsp;</span>';
      h.lineIdx = (h.lineIdx + 1) % (BOOTLOG_LINES.length + 3);
      h.timer = setTimeout(tick, 600);
    };
    tick();
    return;
  }

  // Canvas Modes
  h.pre.style.display = 'none';
  h.canvas.style.display = 'block';
  const ctx = h.canvas.getContext('2d');

  function resize() {
    const rect = h.canvas.parentElement ? h.canvas.parentElement.getBoundingClientRect() : { width: 300, height: 200 };
    h.canvas.width = rect.width || 300;
    h.canvas.height = rect.height || 200;
  }
  resize();

  const onResize = () => resize();
  window.addEventListener('resize', onResize);
  h.cleanups.push(() => window.removeEventListener('resize', onResize));

  let t = 0;
  const modeData = {};

  if (h.kind === 'matrix') {
    const chars = '01アイウエオカキクケコサシスセソ$#@%&*';
    let cols = new Array(Math.floor(h.canvas.width / 14)).fill(0);
    modeData.matrix = { chars, cols };
  } else if (h.kind === 'starfield') {
    const stars = Array.from({ length: 150 }, () => ({
      x: (Math.random() - 0.5) * 1000,
      y: (Math.random() - 0.5) * 1000,
      z: Math.random() * 1000
    }));
    modeData.stars = stars;
  } else if (h.kind === 'pipe_maze') {
    modeData.pipes = [];
    modeData.gridSize = 16;
  } else if (h.kind === 'dvd_logo') {
    modeData.dvd = {
      x: 50,
      y: 50,
      vx: 2,
      vy: 1.5,
      w: 80,
      h: 40,
      color: '#00ffcc'
    };
  } else if (h.kind === 'fire') {
    modeData.fireCols = Math.floor(h.canvas.width / 4);
    modeData.fireRows = Math.floor(h.canvas.height / 4);
    modeData.fireBuf = new Array(modeData.fireCols * modeData.fireRows).fill(0);
  }

  function frame() {
    t += 1;
    const w = h.canvas.width;
    const hg = h.canvas.height;

    switch (h.kind) {
      case 'matrix': {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
        ctx.fillRect(0, 0, w, hg);
        ctx.fillStyle = '#00ff66';
        ctx.font = '13px monospace';
        const cols = modeData.matrix.cols;
        const chars = modeData.matrix.chars;
        if (cols.length !== Math.floor(w / 14)) {
          modeData.matrix.cols = new Array(Math.floor(w / 14)).fill(0);
        }
        modeData.matrix.cols.forEach((y, i) => {
          const ch = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(ch, i * 14, y);
          if (y > hg && Math.random() > 0.975) modeData.matrix.cols[i] = 0;
          else modeData.matrix.cols[i] = y + 14;
        });
        break;
      }

      case 'static': {
        const img = ctx.createImageData(w, hg);
        for (let i = 0; i < img.data.length; i += 4) {
          const v = Math.random() * 255;
          img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
          img.data[i + 3] = 255;
        }
        ctx.putImageData(img, 0, 0);
        break;
      }

      case 'cyber_grid': {
        ctx.fillStyle = '#0a0a12';
        ctx.fillRect(0, 0, w, hg);
        ctx.strokeStyle = '#ff007f';
        ctx.lineWidth = 1;

        const horizon = hg * 0.4;
        const fov = 200;
        const speed = (t * 2) % 40;

        for (let z = 10; z < 400; z += 40) {
          const cz = z - speed;
          if (cz <= 0) continue;
          const py = horizon + (fov * 80) / cz;
          ctx.beginPath();
          ctx.moveTo(0, py);
          ctx.lineTo(w, py);
          ctx.stroke();
        }

        const numCols = 16;
        for (let i = -numCols; i <= numCols; i++) {
          const x0 = w / 2 + i * 20;
          const x1 = w / 2 + i * 180;
          ctx.beginPath();
          ctx.moveTo(x0, horizon);
          ctx.lineTo(x1, hg);
          ctx.stroke();
        }

        const grad = ctx.createRadialGradient(w / 2, horizon, 10, w / 2, horizon, 90);
        grad.addColorStop(0, '#ffcc00');
        grad.addColorStop(0.5, '#ff0055');
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(w / 2, horizon, 80, 0, Math.PI * 2);
        ctx.fill();
        break;
      }

      case 'starfield': {
        ctx.fillStyle = '#000005';
        ctx.fillRect(0, 0, w, hg);
        const cx = w / 2;
        const cy = hg / 2;

        modeData.stars.forEach(s => {
          s.z -= 4;
          if (s.z <= 0) {
            s.z = 1000;
            s.x = (Math.random() - 0.5) * 1000;
            s.y = (Math.random() - 0.5) * 1000;
          }

          const k = 256 / s.z;
          const px = s.x * k + cx;
          const py = s.y * k + cy;

          if (px >= 0 && px < w && py >= 0 && py < hg) {
            const size = Math.max(0.5, (1 - s.z / 1000) * 3);
            const shade = Math.floor((1 - s.z / 1000) * 255);
            ctx.fillStyle = `rgb(${shade},${shade},255)`;
            ctx.fillRect(px, py, size, size);
          }
        });
        break;
      }

      case 'radar': {
        ctx.fillStyle = 'rgba(5, 15, 5, 0.15)';
        ctx.fillRect(0, 0, w, hg);
        const cx = w / 2;
        const cy = hg / 2;
        const radius = Math.min(w, hg) * 0.42;

        ctx.strokeStyle = '#00ff44';
        ctx.lineWidth = 1.5;

        for (let r = 0.25; r <= 1; r += 0.25) {
          ctx.beginPath();
          ctx.arc(cx, cy, radius * r, 0, Math.PI * 2);
          ctx.stroke();
        }

        ctx.beginPath();
        ctx.moveTo(cx - radius, cy);
        ctx.lineTo(cx + radius, cy);
        ctx.moveTo(cx, cy - radius);
        ctx.lineTo(cx, cy + radius);
        ctx.stroke();

        const angle = (t * 0.03) % (Math.PI * 2);
        const sx = cx + Math.cos(angle) * radius;
        const sy = cy + Math.sin(angle) * radius;

        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(sx, sy);
        ctx.strokeStyle = '#00ff88';
        ctx.lineWidth = 2;
        ctx.stroke();

        const blipAngle = 2.1;
        const diff = Math.abs((angle % (Math.PI * 2)) - blipAngle);
        if (diff < 0.1) {
          const bx = cx + Math.cos(blipAngle) * radius * 0.65;
          const by = cy + Math.sin(blipAngle) * radius * 0.65;
          ctx.fillStyle = '#ff3300';
          ctx.beginPath();
          ctx.arc(bx, by, 4, 0, Math.PI * 2);
          ctx.fill();
        }
        break;
      }

      case 'oscilloscope': {
        ctx.fillStyle = 'rgba(0, 10, 5, 0.2)';
        ctx.fillRect(0, 0, w, hg);

        ctx.strokeStyle = '#00ffaa';
        ctx.lineWidth = 2;
        ctx.beginPath();

        const cy = hg / 2;
        for (let x = 0; x < w; x += 2) {
          const y =
            cy +
            Math.sin(x * 0.02 + t * 0.08) * 30 +
            Math.cos(x * 0.05 - t * 0.1) * 15 +
            (Math.random() - 0.5) * 4;
          if (x === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.stroke();
        break;
      }

      case 'pipe_maze': {
        if (t % 3 === 0) {
          ctx.fillStyle = 'rgba(0, 0, 0, 0.01)';
          ctx.fillRect(0, 0, w, hg);

          const g = modeData.gridSize;
          if (modeData.pipes.length === 0 || Math.random() < 0.02) {
            const colors = ['#00f0ff', '#ff007f', '#39ff14', '#ffe600'];
            modeData.pipes.push({
              x: Math.floor(Math.random() * (w / g)) * g,
              y: Math.floor(Math.random() * (hg / g)) * g,
              dir: Math.floor(Math.random() * 4),
              color: colors[Math.floor(Math.random() * colors.length)]
            });
            if (modeData.pipes.length > 8) modeData.pipes.shift();
          }

          modeData.pipes.forEach(p => {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x, p.y, g - 2, g - 2);

            const dirs = [
              [1, 0],
              [0, 1],
              [-1, 0],
              [0, -1]
            ];
            if (Math.random() < 0.2) p.dir = Math.floor(Math.random() * 4);

            p.x = (p.x + dirs[p.dir][0] * g + w) % w;
            p.y = (p.y + dirs[p.dir][1] * g + hg) % hg;
          });
        }
        break;
      }

      case 'dvd_logo': {
        ctx.fillStyle = '#08080c';
        ctx.fillRect(0, 0, w, hg);

        const d = modeData.dvd;
        d.x += d.vx;
        d.y += d.vy;

        const colors = ['#00ffcc', '#ff0055', '#ffcc00', '#9900ff', '#00ff66'];

        if (d.x <= 0 || d.x + d.w >= w) {
          d.vx *= -1;
          d.color = colors[Math.floor(Math.random() * colors.length)];
        }
        if (d.y <= 0 || d.y + d.h >= hg) {
          d.vy *= -1;
          d.color = colors[Math.floor(Math.random() * colors.length)];
        }

        ctx.fillStyle = d.color;
        ctx.fillRect(d.x, d.y, d.w, d.h);

        ctx.fillStyle = '#000';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('SPACER', d.x + d.w / 2, d.y + d.h / 2);
        break;
      }

      case 'glitch_text': {
        ctx.fillStyle = 'rgba(10, 10, 15, 0.3)';
        ctx.fillRect(0, 0, w, hg);

        ctx.font = 'bold 24px monospace';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        const text = 'SYSTEM ONLINE';

        ctx.fillStyle = 'rgba(255, 0, 80, 0.8)';
        ctx.fillText(text, w / 2 + (Math.random() - 0.5) * 8, hg / 2 + (Math.random() - 0.5) * 4);

        ctx.fillStyle = 'rgba(0, 240, 255, 0.8)';
        ctx.fillText(text, w / 2 + (Math.random() - 0.5) * 8, hg / 2 + (Math.random() - 0.5) * 4);

        ctx.fillStyle = '#ffffff';
        ctx.fillText(text, w / 2, hg / 2);

        if (Math.random() < 0.25) {
          const sy = Math.random() * hg;
          const sh = Math.random() * 20 + 5;
          const slice = ctx.getImageData(0, sy, w, sh);
          ctx.putImageData(slice, (Math.random() - 0.5) * 20, sy);
        }
        break;
      }

      case 'fire': {
        const cols = modeData.fireCols || Math.floor(w / 4);
        const rows = modeData.fireRows || Math.floor(hg / 4);
        const buf = modeData.fireBuf || new Array(cols * rows).fill(0);

        for (let c = 0; c < cols; c++) {
          buf[(rows - 1) * cols + c] = Math.random() > 0.4 ? 255 : 0;
        }

        for (let r = 0; r < rows - 1; r++) {
          for (let c = 0; c < cols; c++) {
            const idx = r * cols + c;
            const below = (r + 1) * cols + c;
            const decay = Math.floor(Math.random() * 12);
            buf[idx] = Math.max(0, (buf[below] || 0) - decay);
          }
        }

        const pw = Math.ceil(w / cols);
        const ph = Math.ceil(hg / rows);

        for (let r = 0; r < rows; r++) {
          for (let c = 0; c < cols; c++) {
            const val = buf[r * cols + c];
            if (val > 0) {
              const red = val;
              const green = Math.max(0, val - 100);
              const blue = Math.max(0, val - 200);
              ctx.fillStyle = `rgb(${red},${green},${blue})`;
              ctx.fillRect(c * pw, r * ph, pw, ph);
            }
          }
        }

        modeData.fireBuf = buf;
        break;
      }

      default:
        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, hg);
    }

    h.raf = requestAnimationFrame(frame);
  }

  frame();
}

  // ── alerts (popup) ───────────────────────────────────────────────────
  const alerts = {
    mount(body, win) {
      body.classList.add('wm-term', 'alerts-body');
      body.style.backgroundColor = win.opts.bg_color || '';
      return { body, hideTimer: null };
    },
    onState(h, key, msg, overlayState, wm, winId) {
      if (key !== 'alert_event') return;
      const label = { sub: 'new subscriber', resub: 'resubscribed', bits: 'cheered bits', follow: 'new follower', raid: 'raid' }[msg.alert] || msg.alert;
      h.body.innerHTML = `<div class="line">${escapeHtml(label)}</div><div class="line" style="font-weight:700">${escapeHtml(msg.message || '')}</div>` +
        (msg.sub ? `<div class="line wm-dim">${escapeHtml(msg.sub)}</div>` : '');
      wm.showPopup(winId, true);
      if (h.hideTimer) clearTimeout(h.hideTimer);
      h.hideTimer = setTimeout(() => wm.showPopup(winId, false), 6000);
    },
  };

  // ── redeem_player (popup) ────────────────────────────────────────────
  const redeem_player = {
    mount(body, win) {
       body.style.backgroundColor = win.opts.bg_color || '';
      body.style.display = 'flex';
      body.style.alignItems = 'center';
      body.style.justifyContent = 'center';
      const video = $create('video');
      video.playsInline = true;
      const mainAudio = $create('audio');
      const scoreAudio = $create('audio');
      video.style.maxWidth = '100%';
      video.style.maxHeight = '100%';
      video.style.display = 'none';
      body.appendChild(video);
      body.appendChild(mainAudio);
      body.appendChild(scoreAudio);
      return { video, mainAudio, scoreAudio, queue: [], playing: false, activeCount: 0, watchdogs: [] };
    },
    onState(h, key, msg, overlayState, wm, winId) {
      if (key !== 'play_media') return;
      h.queue.push(msg);
      playNextMedia(h, wm, winId);
    },
  };
  function isVideoFile(name) { return /\.(mp4|webm|mov)$/i.test(name); }
  function clearWatchdogs(h) { h.watchdogs.forEach(w => clearTimeout(w)); h.watchdogs = []; }
  function armWatchdog(h, el, onDone) {
    const guessMs = (isFinite(el.duration) && el.duration > 0) ? (el.duration * 1000) + 3000 : 60000;
    h.watchdogs.push(setTimeout(onDone, guessMs));
  }
  function playEl(el, url) {
    return new Promise((resolve) => {
      el.muted = false; el.src = url; el.currentTime = 0;
      el.play().then(resolve).catch(() => {
        el.muted = true;
        el.play().then(resolve).catch(() => resolve());
      });
    });
  }
  function trackMediaEl(h, el, wm, winId) {
    h.activeCount++;
    const done = () => {
      el.removeEventListener('ended', done);
      el.removeEventListener('error', done);
      h.activeCount = Math.max(0, h.activeCount - 1);
      if (h.activeCount === 0) finishMediaItem(h, wm, winId);
    };
    el.addEventListener('ended', done);
    el.addEventListener('error', done);
    armWatchdog(h, el, done);
  }
  function playNextMedia(h, wm, winId) {
    if (h.playing || !h.queue.length) return;
    h.playing = true;
    h.activeCount = 0;
    clearWatchdogs(h);
    wm.showPopup(winId, true);
    const item = h.queue.shift();
    const mainUrl = '/media/' + encodeURIComponent(item.file);
    const mainIsVideo = isVideoFile(item.file);
    const mainEl = mainIsVideo ? h.video : h.mainAudio;
    if (mainIsVideo) { h.mainAudio.pause(); h.video.style.display = 'block'; }
    else { h.video.pause(); h.video.style.display = 'none'; }
    playEl(mainEl, mainUrl).then(() => trackMediaEl(h, mainEl, wm, winId));
    if (item.audio) {
      const scoreUrl = '/media/' + encodeURIComponent(item.audio);
      playEl(h.scoreAudio, scoreUrl).then(() => trackMediaEl(h, h.scoreAudio, wm, winId));
    }
  }
  function finishMediaItem(h, wm, winId) {
    clearWatchdogs(h);
    h.video.style.display = 'none';
    h.video.pause(); h.mainAudio.pause(); h.scoreAudio.pause();
    h.video.removeAttribute('src'); h.mainAudio.removeAttribute('src'); h.scoreAudio.removeAttribute('src');
    h.playing = false;
    wm.showPopup(winId, false);
    playNextMedia(h, wm, winId);
  }

  // ── pngtuber (topmost) ───────────────────────────────────────────────
  const pngtuber = {
    mount(body) {
      body.style.background = 'transparent';
      body.style.display = 'flex';
      body.style.alignItems = 'flex-end';
      body.style.justifyContent = 'center';
      const img = $create('img', 'pngtuber-frame');
      body.appendChild(img);
      return {
        img, assets: {}, currentState: null, currentSrc: {},
        chattingUntil: 0, ttsState: {}, statusText: '', mood: 'neutral',
      };
    },
    onState(h, key, msg) {
      if (key === 'assets') { h.assets = msg; applyPngtuberState(h); return; }
      if (key === 'tts_state') { h.ttsState = msg; applyPngtuberState(h); return; }
      if (key === 'status') { h.statusText = msg.value || ''; applyPngtuberState(h); return; }
      if (key === 'pngtuber') { h.mood = (msg && msg.mood) || 'neutral'; applyPngtuberState(h); return; }
      if (key === 'chat') { h.chattingUntil = Date.now() + 4000; applyPngtuberState(h); return; }
      if (key === 'tick') { applyPngtuberState(h); return; }
    },
  };
  function pickPngtuberImage(h, stateName) {
    const list = h.assets[stateName];
    if (!list || !list.length) return null;
    if (!h.currentSrc[stateName] || list.length === 1) {
      h.currentSrc[stateName] = list[Math.floor(Math.random() * list.length)];
    }
    return h.currentSrc[stateName];
  }
  function resolvePngtuberState(h) {
    const tts = h.ttsState || {};
    if (tts.speaking) return 'speaking';
    if (tts.generating) return 'generating';
    if (Date.now() < h.chattingUntil) return 'chatting';
    if ((h.statusText || '').toLowerCase().includes('playing:')) return 'playing';
    return h.mood || 'neutral';
  }
  function applyPngtuberState(h) {
    const next = resolvePngtuberState(h);
    if (next === h.currentState) return;
    h.currentState = next;
    if (!['neutral', 'bored', 'sad', 'cheerful'].includes(next)) delete h.currentSrc[next];
    const src = pickPngtuberImage(h, next) || pickPngtuberImage(h, 'neutral');
    if (src) {
      h.img.style.opacity = 0;
      setTimeout(() => { h.img.src = src; h.img.style.opacity = 1; }, 100);
    }
    h.img.classList.toggle('speaking', next === 'speaking');
  }

  return {
    now_playing, lyrics, status, socials, message_bar, screen, chat, extra, spacer,
    alerts, redeem_player, pngtuber,
    escapeHtml,
  };
})();

</script>
<script>
(function () {
  const DEFAULT_LAYOUT = [
    { id: 'now_playing', panel: 'now_playing', title: 'now playing', x: 1040, y: 20,  w: 380, h: 160, z: 1, kind: 'normal' },
    { id: 'lyrics',      panel: 'lyrics',      title: 'lyrics',      x: 1040, y: 190, w: 380, h: 160, z: 1, kind: 'normal' },
    { id: 'status',      panel: 'status',      title: 'pc status',   x: 20,   y: 900, w: 220, h: 130, z: 1, kind: 'normal' },
    { id: 'socials',     panel: 'socials',     title: 'socials',     x: 20,   y: 780, w: 220, h: 70,  z: 1, kind: 'normal', opts: { social_lines: 'twitter: @vanillyn_net\ndiscord: @vanillyn' } },
    { id: 'message_bar', panel: 'message_bar', title: 'message',    x: 20,   y: 740, w: 220, h: 36,  z: 1, kind: 'normal', opts: { text_color: '#d8dee2', bg_color: '#0a0c0d', font_size: 13, font_family: 'monospace' } },
    { id: 'screen',      panel: 'screen',      title: 'screen',      x: 260,  y: 780, w: 400, h: 260, z: 0, kind: 'normal' },
    { id: 'chat',        panel: 'chat',        title: 'chat',        x: 20,   y: 20,  w: 380, h: 480, z: 1, kind: 'normal' },
    { id: 'extra',       panel: 'extra',       title: 'extra',       x: 1040, y: 900, w: 380, h: 130, z: 1, kind: 'normal' },
    { id: 'spacer1',     panel: 'spacer',      title: 'log',         x: 20,   y: 520, w: 220, h: 240, z: 1, kind: 'normal', opts: { spacer_kind: 'bootlog' } },
    { id: 'alerts',      panel: 'alerts',      title: 'alert',       x: 530,  y: 40,  w: 420, h: 140, z: 500, kind: 'popup', visible: false },
    { id: 'redeem_player', panel: 'redeem_player', title: 'redeem',  x: 460,  y: 300, w: 520, h: 440, z: 500, kind: 'popup', visible: false },
    { id: 'pngtuber',    panel: 'pngtuber',    title: 'pngtuber',    x: 900,  y: 500, w: 400, h: 580, z: 999999, kind: 'topmost' },
  ];

  const WS_URL = `ws://${location.hostname}:8877`;
  let ws = null;
  const overlayState = { channel: (new URLSearchParams(location.search)).get('channel') || '' };
  const handles = new Map(); // winId -> panel handle

  const wm = createWM({
    stageEl: document.getElementById('stage'),
    editable: false,
    renderBody: (win, bodyEl) => {
      const renderer = Panels[win.panel];
      if (!renderer) { bodyEl.textContent = 'unknown panel: ' + win.panel; return; }
      const h = renderer.mount(bodyEl, win, overlayState);
      handles.set(win.id, h);
    },
  });

  // topmost windows (pngtuber) should never intercept pointer events meant
  // for OBS click-through zones; overlay is a browser source anyway, but
  // keep it visually correct regardless.
  function broadcastToAllPanels(key, msg) {
    wm.forEachWindow((win) => {
      const renderer = Panels[win.panel];
      const h = handles.get(win.id);
      if (renderer && h && renderer.onState) {
        renderer.onState(h, key, msg, overlayState, wm, win.id);
      }
    });
  }

  function applyLayoutFromServer(layout) {
    if (Array.isArray(layout) && layout.length) {
      wm.setLayout(layout, { silent: true });
    } else {
      wm.setLayout(DEFAULT_LAYOUT, { silent: true });
    }
  }

  function connect() {
    ws = new WebSocket(WS_URL);
    ws.onopen = () => {};
    ws.onclose = () => setTimeout(connect, 2000);
    ws.onerror = () => ws.close();
    ws.onmessage = (ev) => {
      let msg;
      try { msg = JSON.parse(ev.data); } catch { return; }
      handleMessage(msg);
    };
  }

  function handleMessage(msg) {
    const t = msg.type;
    if (t === 'init') {
      const s = msg.state || {};
      applyLayoutFromServer(s.wm_layout);
      if (s.music) broadcastToAllPanels('music', s.music);
      if (s.stats) broadcastToAllPanels('stats', s.stats);
      if (s.status) broadcastToAllPanels('status', { value: s.status });
      if (s.extra !== undefined) broadcastToAllPanels('extra', { value: s.extra });
      if (s.pngtuber) broadcastToAllPanels('pngtuber', s.pngtuber);
      (s.chat || []).forEach(c => broadcastToAllPanels('chat', c));
      fetch('/pngtuber-list').then(r => r.json()).then(a => broadcastToAllPanels('assets', a)).catch(() => {});
      if (s.tts) broadcastToAllPanels('tts_state', s.tts);
      return;
    }
    if (t === 'wm_layout') { applyLayoutFromServer(msg.layout); return; }
    if (t === 'music') { broadcastToAllPanels('music', msg); return; }
    if (t === 'music_video') { broadcastToAllPanels('music_video', msg); return; }
    if (t === 'stats') { broadcastToAllPanels('stats', msg); return; }
    if (t === 'status') { broadcastToAllPanels('status', { value: msg.value }); return; }
    if (t === 'message') { broadcastToAllPanels('message', { value: msg.value }); return; }
    if (t === 'extra') { broadcastToAllPanels('extra', { value: msg.value }); return; }
    if (t === 'chat') { broadcastToAllPanels('chat', msg); return; }
    if (t === 'lyrics') { broadcastToAllPanels('lyrics', msg); return; }
    if (t === 'pngtuber') { broadcastToAllPanels('pngtuber', msg.pngtuber); return; }
    if (t === 'tts_state') { broadcastToAllPanels('tts_state', msg.tts); return; }
    if (t === 'play_media') { broadcastToAllPanels('play_media', msg); return; }
    if (t === 'alert') { broadcastToAllPanels('alert_event', msg); return; }
    if (t === 'follow') { broadcastToAllPanels('alert_event', { alert: 'follow', message: msg.user + ' followed!' }); return; }
    if (t === 'raid') { broadcastToAllPanels('alert_event', { alert: 'raid', message: msg.user + ' raided!', sub: (msg.viewers || 0) + ' raiders' }); return; }
    if (t === 'redeem_alert') { broadcastToAllPanels('alert_event', { alert: 'redeem', message: msg.user + ' → ' + msg.reward, sub: msg.message || '' }); return; }
  }

  // pngtuber needs a periodic tick even without new messages, to catch the
  // chattingUntil timeout expiring
  setInterval(() => broadcastToAllPanels('tick', {}), 300);

  connect();
})();
</script>
</body>
</html>
